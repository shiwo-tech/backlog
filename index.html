<!doctype html>
<!--
  ╔══════════════════════════════════════════════════════════════════════╗
  ║  BACKLOG — application locale (index.html + data.json)               ║
  ║  HTML / CSS / JavaScript natifs, aucune dépendance, aucun serveur.   ║
  ╠══════════════════════════════════════════════════════════════════════╣
  ║  Organisation du fichier                                             ║
  ║   1. CSS      : thème (variables), mise en page, composants          ║
  ║   2. HTML     : coque de l'application + symboles d'icônes           ║
  ║   3. JS       : sections numérotées                                  ║
  ║        A. constantes & utilitaires    B. données (chargement/sauvegarde)
  ║        C. calculs (index, stats, Backlog Score)                      ║
  ║        D. graphiques SVG              E. vues (une fonction par écran)
  ║        F. fenêtres (formulaires)      G. actions & démarrage         ║
  ║  Les données viennent exclusivement de data.json (voir SCHEMA.md).   ║
  ╚══════════════════════════════════════════════════════════════════════╝
-->
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Backlog</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%238391ff%22/%3E%3Cstop offset=%221%22 stop-color=%22%23ff7aa8%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2264%22 height=%2264%22 rx=%2215%22 fill=%22url%28%23g%29%22/%3E%3Crect x=%229%22 y=%2220%22 width=%2246%22 height=%2226%22 rx=%2213%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%224%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M22 27v12M16 33h12%22 stroke=%22%23fff%22 stroke-width=%224%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2241%22 cy=%2231%22 r=%222.6%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2247.5%22 cy=%2236.5%22 r=%222.6%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<style>
/* ═══════════════ 1. THÈME ═══════════════
   Trois couleurs de catégorie, utilisées partout pour encoder l'information :
   jeux = indigo, BD = ambre, romans = rose. */
:root{
  --bg:#090b12; --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.08); --glass-3:rgba(255,255,255,.13);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
  --tx:#eceef6; --tx2:#a5abc1; --tx3:#7a8097;
  --c-jeux:#8391ff; --c-bd:#ffb35c; --c-roman:#ff7aa8;
  --ok:#4fd8a4; --warn:#ffc857; --bad:#ff6b7a;
  --r:20px; --r-s:12px; --shadow:0 18px 50px -20px rgba(0,0,0,.7);
  --ease:cubic-bezier(.2,.8,.2,1);
  --font:ui-sans-serif,-apple-system,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
:root[data-theme=light]{
  --bg:#f2f3f8; --glass:rgba(255,255,255,.72); --glass-2:rgba(255,255,255,.95); --glass-3:rgba(20,24,60,.07);
  --line:rgba(25,30,70,.10); --line-2:rgba(25,30,70,.2);
  --tx:#161a2c; --tx2:#4a5069; --tx3:#7a8099;
  --c-jeux:#4658e8; --c-bd:#d27a08; --c-roman:#d2407a; --ok:#10996c; --warn:#b98400; --bad:#d6334a;
  --shadow:0 14px 36px -18px rgba(30,40,100,.28);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font:15px/1.45 var(--font); color:var(--tx); min-height:100dvh; -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 560px at 8% -12%,color-mix(in srgb,var(--c-jeux) 24%,transparent),transparent 62%),
    radial-gradient(900px 520px at 104% 2%,color-mix(in srgb,var(--c-roman) 15%,transparent),transparent 58%),
    radial-gradient(800px 500px at 60% 112%,color-mix(in srgb,var(--c-bd) 10%,transparent),transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
:focus-visible{outline:2px solid var(--c-jeux);outline-offset:2px;border-radius:8px}
::selection{background:color-mix(in srgb,var(--c-jeux) 40%,transparent)}
[hidden]{display:none!important}
.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ═══════════════ 2. COQUE ═══════════════ */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;padding:22px 14px 16px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 20px;font-weight:680;font-size:1.08rem;letter-spacing:-.02em}
.mark{width:30px;height:30px;display:block;flex:none;filter:drop-shadow(0 4px 14px color-mix(in srgb,var(--c-jeux) 40%,transparent))}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--tx2);font-weight:540;cursor:pointer;position:relative;transition:background .2s,color .2s}
.nav button:hover{background:var(--glass);color:var(--tx)}
.nav button[aria-current=page]{background:var(--glass-2);color:var(--tx)}
.nav button[aria-current=page]::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--acc,var(--c-jeux))}
.nav .cnt{margin-left:auto;font-size:.75rem;color:var(--tx3)}
.nav button:focus-visible,.tabbar button:focus-visible{outline:2px solid var(--c-jeux);outline-offset:2px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.savepill{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font-size:.8rem;color:var(--tx2);text-align:left;width:100%}
.savepill i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.savepill.dirty i{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 25%,transparent)}
.savepill.bad i{background:var(--bad,#ef4444);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad,#ef4444) 25%,transparent)}
.savepill:hover{background:var(--glass-2)}
.side-row{display:flex;gap:6px}
.main{padding:30px clamp(16px,3vw,44px) 90px;width:100%;max-width:1400px;margin:0 auto}
.tabbar{display:none}

/* ═══════════════ 3. COMPOSANTS ═══════════════ */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);box-shadow:var(--shadow)}
.pad{padding:20px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
h1{font-size:clamp(1.7rem,3vw,2.3rem);font-weight:680;letter-spacing:-.035em;line-height:1.1}
h2{font-size:1.05rem;font-weight:640;letter-spacing:-.015em}
h3{font-size:.95rem;font-weight:620}
.sub{color:var(--tx2);margin-top:6px}
.muted{color:var(--tx2)} .faint{color:var(--tx3)}
.hello{align-items:center;justify-content:flex-start;gap:18px} .hello>.row{margin-left:auto}
.avatar{height:84px;width:auto;flex:none;filter:drop-shadow(0 6px 16px rgba(0,0,0,.35));margin:-6px 0 -6px;animation:bob 5s ease-in-out infinite}
.pseudo{background:linear-gradient(100deg,var(--c-jeux),var(--c-roman));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes bob{50%{transform:translateY(-4px) rotate(-1.5deg)}}
.exp{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:22px;align-items:start}
.exp-panel{display:grid;gap:12px;min-width:0}
.exp-card{padding:18px 20px;border-radius:20px}
.exp-card h3{font-size:1rem}
.exp-body{display:grid;gap:12px;margin-top:14px}
.exp-body .field{margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:.92rem;cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:42px;height:25px;border-radius:99px;background:var(--glass-3);position:relative;cursor:pointer;transition:background .2s;border:1px solid var(--line)}
.sw input::after{content:"";position:absolute;left:2px;top:2px;width:19px;height:19px;border-radius:50%;background:var(--tx);opacity:.8;transition:transform .25s var(--ease),opacity .2s}
.sw input:checked{background:var(--c-jeux)}
.sw input:checked::after{transform:translateX(17px);background:#fff;opacity:1}
.sw input:focus-visible{outline:2px solid var(--c-jeux);outline-offset:2px}
.sw.head{cursor:default}
.exp-prev{position:sticky;top:16px;padding:14px;border-radius:24px;max-height:calc(100dvh - 32px);overflow:auto;min-width:0}
.exp-prev canvas{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 18px 50px -20px rgba(0,0,0,.6)}
.exp-warn{margin:0 0 10px;padding:9px 12px;border-radius:12px;font-size:.82rem;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px}
.sec-title p{color:var(--tx3);font-size:.85rem}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--glass-2);color:var(--tx);font-weight:560;transition:background .2s,transform .15s,border-color .2s;white-space:nowrap}
.btn:hover{background:var(--glass-3);border-color:var(--line-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc,var(--c-jeux));border-color:transparent;color:#0a0c14}
:root[data-theme=light] .btn.primary{color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
.btn.ghost:hover{background:var(--glass);color:var(--tx)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:.84rem;border-radius:10px}
.btn.icon{padding:8px;aspect-ratio:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--tx2);font-size:.85rem;font-weight:540;transition:all .2s}
.chip:hover{border-color:var(--line-2);color:var(--tx)}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--acc,var(--c-jeux)) 22%,transparent);border-color:color-mix(in srgb,var(--acc,var(--c-jeux)) 55%,transparent);color:var(--tx)}
.input,.select,textarea.input{width:100%;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--tx);outline:none;transition:border-color .2s,background .2s}
.input:focus,.select:focus{border-color:var(--acc,var(--c-jeux));background:var(--glass-2)}
.select{appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.select option{background:#151826;color:#eceef6}
:root[data-theme=light] .select option{background:#fff;color:#161a2c}
.search{position:relative;flex:1 1 240px;max-width:380px}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.search .input{padding-left:38px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-size:.82rem;color:var(--tx2);font-weight:560}
.field .hint{font-size:.78rem;color:var(--tx3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:.74rem;font-weight:600;background:var(--glass-2);color:var(--tx2);white-space:nowrap}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pc,var(--tx3))}
.pill.s-en_cours{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.pill.s-termine{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.pill.s-abandonne{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.p1{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.p2{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.p3{background:var(--glass-2);color:var(--tx2)}
.bar{height:6px;border-radius:99px;background:var(--glass-2);overflow:hidden}
.bar>i{display:block;height:100%;width:var(--w,0%);background:var(--col,var(--c-jeux));border-radius:inherit;transition:width .9s var(--ease)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.kv:last-child{border:0} .kv b{font-weight:620}
.empty{padding:46px 20px;text-align:center;color:var(--tx2)}
.empty .ic{width:34px;height:34px;color:var(--tx3);margin:0 auto 12px}

/* Couleurs de catégorie */
.k-JEUX{--acc:var(--c-jeux)} .k-BD{--acc:var(--c-bd)} .k-ROMAN{--acc:var(--c-roman)}
.f-JEUX{fill:var(--c-jeux)} .f-BD{fill:var(--c-bd)} .f-ROMAN{fill:var(--c-roman)}
.s-JEUX{stroke:var(--c-jeux)} .s-BD{stroke:var(--c-bd)} .s-ROMAN{stroke:var(--c-roman)}
.t-JEUX{color:var(--c-jeux)} .t-BD{color:var(--c-bd)} .t-ROMAN{color:var(--c-roman)}

/* Anneaux, graphiques */
.ring-p{transition:stroke-dashoffset 1.2s var(--ease)}
.chart text{font-family:var(--font);fill:var(--tx3);font-size:12px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .bar-r{transition:opacity .2s}
.chart .bar-r:hover{opacity:.78}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;gap:12px;align-items:center;padding:6px 0;font-size:.9rem}
.hb .l{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb b{font-weight:620;min-width:2ch;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--tx2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(--lc)}
.tip{position:fixed;z-index:200;pointer-events:none;padding:7px 11px;border-radius:10px;background:#12151f;color:#eef0f7;font-size:.8rem;border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 30px rgba(0,0,0,.45);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:260px}
.tip.on{opacity:1;transform:none}
.tip{white-space:pre-line}

/* ═══════════════ 4. ÉCRANS ═══════════════ */
/* Accueil : bloc « prochain à finir » */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.pick{position:relative;overflow:hidden;padding:26px;border-radius:26px;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 24%,var(--glass)),var(--glass) 62%);border:1px solid color-mix(in srgb,var(--acc) 38%,var(--line))}
.pick h2{font-size:clamp(1.4rem,2.4vw,2rem);font-weight:690;letter-spacing:-.03em;line-height:1.12;margin:6px 0 10px}
.pick .eyebrow{font-size:.82rem;color:var(--acc);font-weight:640;display:flex;align-items:center;gap:8px}
.dial{position:relative;width:148px;height:148px}
.dial .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dial .v b{font-size:2.6rem;font-weight:700;letter-spacing:-.05em;line-height:1}
.dial .v span{font-size:.72rem;color:var(--tx3);margin-top:4px}
.why{display:grid;gap:7px;margin:14px 0 18px}
.why div{display:grid;grid-template-columns:104px 1fr 34px;gap:10px;align-items:center;font-size:.8rem;color:var(--tx2)}
.why .bar{height:5px}
.mini-picks{display:grid;gap:16px;min-width:0}
.mini>div{min-width:0}
.mini{padding:16px;border-radius:20px;display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;cursor:pointer;transition:transform .2s var(--ease),border-color .2s}
.mini:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.mini h3{line-height:1.25;margin:2px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.obj{padding:22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.obj .big{font-size:1.9rem;font-weight:690;letter-spacing:-.04em;line-height:1}
.obj .big small{font-size:1rem;color:var(--tx3);font-weight:560}
.obj .ringbox{position:relative}
.obj .ringbox .in{position:absolute;inset:0;display:grid;place-content:center}
.delta{font-size:.82rem;font-weight:600;padding:3px 10px;border-radius:99px}
.delta.up{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.delta.down{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.kpi{padding:18px 20px}
.kpi .lab{font-size:.82rem;color:var(--tx2);display:flex;align-items:center;gap:8px}
.kpi .val{font-size:2rem;font-weight:690;letter-spacing:-.045em;line-height:1.1;margin:8px 0 4px}
.kpi .val small{font-size:.9rem;color:var(--tx3);font-weight:560;letter-spacing:0}
.kpi .foot{font-size:.8rem;color:var(--tx3)}

/* Cartes jeux */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.gcard{display:flex;flex-direction:column;gap:12px;padding:16px 16px 14px;border-radius:20px;border-left:3px solid var(--pc,var(--acc));transition:transform .25s var(--ease),border-color .25s}
.gtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.gtop .metas{margin-bottom:0}
.gcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.gcard h3{font-size:1.05rem;line-height:1.25;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.metas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.hltb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:11px}
.hltb div,.hltb .hc{background:var(--glass);border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:.7rem;color:var(--tx3);line-height:1.25;text-align:left;font-family:inherit}
.hltb .hc{cursor:pointer;transition:border-color .15s,background .15s}
.hltb .hc:not(:disabled):hover{border-color:var(--line-2);background:var(--glass-2)}
.hltb .hc:disabled{cursor:default;opacity:.7}
.hltb .hc:focus-visible{outline:2px solid var(--acc,var(--c-jeux));outline-offset:2px}
.hltb .tgt{color:var(--acc,var(--c-jeux));font-size:.6rem;vertical-align:1px}
.obj-line{font-size:.86rem;margin:2px 0 4px;line-height:1.5}
.linkbtn{background:none;border:0;padding:0;color:var(--acc,var(--c-jeux));font:inherit;text-decoration:underline;cursor:pointer}
.hltb b{display:block;font-size:.88rem;color:var(--tx);font-weight:620}
.hltb .ref{border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.prog{display:flex;justify-content:space-between;font-size:.78rem;color:var(--tx2);margin-bottom:5px}
.cact{display:flex;gap:6px;margin-top:2px;align-items:center}
.score-chip{margin-left:auto;font-size:.76rem;color:var(--tx3);display:flex;align-items:center;gap:5px}

/* Bibliothèque BD / romans : tuiles typographiques (numéro de tome + titre) */
.shelf-h{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.shelf-h h2{font-size:1.1rem}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-top:6px}
.shelf-card{padding:16px 16px 18px;border-radius:20px;min-width:0}

.vol{display:flex;align-items:center;gap:11px;min-width:0;padding:10px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);text-align:left;cursor:pointer;transition:transform .2s var(--ease),border-color .2s,background .2s}
.vol:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--acc) 55%,var(--line));background:var(--glass-2)}
.vol .vn{font-size:1.2rem;font-weight:700;letter-spacing:-.04em;color:var(--acc);min-width:2.1ch;line-height:1}
.vol .vt{font-size:.84rem;color:var(--tx);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.vol .vt em{display:block;font-style:normal;font-size:.7rem;color:var(--tx3);margin-top:2px}
.vol .vt em.nx{color:var(--ok)}

.vol.next{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.sdial{position:relative;flex:none}
.sdial b{position:absolute;inset:0;display:grid;place-content:center;font-size:.82rem;font-weight:690;letter-spacing:-.03em}

/* Séries suivies */
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.scard{padding:18px;border-radius:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.scard h3{font-size:1.05rem;line-height:1.25}
.scard .nums{display:flex;gap:22px}

.scard .nums b{display:block;font-size:1.35rem;color:var(--tx);font-weight:680;letter-spacing:-.04em}

/* Tops */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.pod{padding:22px 20px;border-radius:22px;display:flex;flex-direction:column;gap:10px;min-height:150px;position:relative;overflow:hidden}

.pod.p1{background:linear-gradient(145deg,color-mix(in srgb,var(--c-bd) 26%,var(--glass)),var(--glass) 70%);border:1px solid color-mix(in srgb,var(--c-bd) 45%,var(--line))}
.pod.p2 .pn{opacity:.7} .pod.p3 .pn{opacity:.5}
.pod h3{font-size:1.1rem;line-height:1.25;margin-top:auto}
.toprows{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:28px}
.toprows .li{grid-template-columns:auto minmax(0,1fr)}
.toprows .rank{font-size:1.3rem;min-width:1.8em;color:var(--tx3)}

/* Abonnements */
.abo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line)}
.abo:last-child{border:0}
.abo .t{font-weight:600;font-size:1.02rem}
.abo .pr{text-align:right;font-weight:660;letter-spacing:-.02em}
.abo .pr small{display:block;font-weight:500;color:var(--tx3);font-size:.76rem;letter-spacing:0}
.abo .share{margin-top:9px;max-width:420px}
.abo.off{opacity:.55}

/* Historique */
.tl{position:relative;margin-left:8px;padding-left:34px}
.tl::before{content:"";position:absolute;left:5px;top:12px;bottom:12px;width:2px;background:linear-gradient(var(--line-2),var(--line))}
.ty{position:relative;margin-bottom:14px}

.ty[open]::before{border-color:var(--c-jeux);background:var(--c-jeux);box-shadow:0 0 0 5px color-mix(in srgb,var(--c-jeux) 22%,transparent)}
.ty>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:18px 22px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line)}

.ty .tri{display:flex;gap:18px;flex-wrap:wrap}
.ty .tri div{min-width:78px}
.ty .tri b{display:block;font-size:1.25rem;font-weight:670;letter-spacing:-.03em}
.ty .tri span{font-size:.75rem;color:var(--tx3)}
.ty .tri .bar{margin-top:5px;height:4px}
.ty .body{padding:16px 6px 6px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.tlist{list-style:none;padding:0;font-size:.88rem}
.tlist li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);color:var(--tx2)}

/* Tableau (achats, séries) */
.list{display:grid}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li .t{font-weight:580;overflow:hidden;text-overflow:ellipsis}
.li .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.rank{font-size:2.4rem;font-weight:700;letter-spacing:-.06em;color:var(--tx3);min-width:1.6em;line-height:1}
.top3 .rank{color:var(--acc)}

/* Fenêtres, toasts */
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(5,7,14,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal{width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px;border-radius:24px;background:color-mix(in srgb,var(--bg) 82%,#fff 6%);border:1px solid var(--line-2);box-shadow:0 30px 90px -20px rgba(0,0,0,.8);animation:pop .28s var(--ease)}

.modal h2{font-size:1.25rem;margin-bottom:4px}

.cmd{align-self:start;margin-top:12vh;width:min(600px,100%);padding:10px}
.cmd .input{border:0;background:transparent;font-size:1.1rem;padding:14px}
.cmd ul{list-style:none;padding:6px 0 0;border-top:1px solid var(--line);max-height:50vh;overflow:auto}
.cmd li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer}
.cmd li[aria-selected=true]{background:var(--glass-2)}
.cmd li small{margin-left:auto;color:var(--tx3)}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:150;display:grid;gap:8px;justify-items:center}
.toast{display:flex;align-items:center;gap:14px;padding:11px 16px;border-radius:14px;background:#171a27;color:#eef0f7;border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 40px rgba(0,0,0,.5);animation:pop .3s var(--ease)}
.toast button{background:none;border:0;color:var(--c-bd);font-weight:640}
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:13px 18px;margin-bottom:20px;border-radius:16px;border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.welcome{min-height:100dvh;display:grid;place-items:center;padding:20px}
.welcome .box{width:min(560px,100%);padding:34px;text-align:center}
.welcome h1{margin:14px 0 10px}
.welcome p{color:var(--tx2);margin-bottom:10px}

.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--c-jeux);animation:rot .8s linear infinite;margin:auto}

@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}} @keyframes rot{to{transform:rotate(1turn)}}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
#view.enter>*{animation:enter .4s var(--ease) backwards}

/* ═══════════════ 4b. NOTES, SAUVEGARDES, AJOUT RAPIDE ═══════════════ */
.nb{--nc:var(--c-jeux);display:inline-grid;place-items:center;min-width:2.3em;height:1.9em;padding:0 .45em;border-radius:9px;font-weight:720;font-size:.86rem;font-variant-numeric:tabular-nums;color:var(--nc);background:color-mix(in srgb,var(--nc) 15%,transparent);border:1px solid color-mix(in srgb,var(--nc) 40%,transparent);flex:none}

.toprows .li{grid-template-columns:auto minmax(0,1fr) auto}

table.cmp{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:6px}

table.cmp td{padding:7px 8px;border-top:1px solid var(--line)} table.cmp td.num{text-align:right;white-space:nowrap}
table.cmp td:first-child{color:var(--tx2)}

.vers{max-height:56vh;overflow:auto;display:grid;gap:2px}
.vers .li{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line)}
#notices .banner{margin-bottom:14px}
.banner.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.banner.soft{border-color:var(--line-2);background:var(--glass)}
.fab{position:fixed;right:28px;bottom:28px;z-index:70;width:58px;height:58px;border-radius:20px;border:0;display:grid;place-items:center;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--c-jeux),var(--c-roman));box-shadow:0 14px 34px color-mix(in srgb,var(--c-jeux) 45%,transparent),0 2px 0 rgba(255,255,255,.25) inset;transition:transform .2s var(--ease)}
.fab .ic{width:26px;height:26px;stroke-width:2.2}
.fab:hover{transform:translateY(-2px) scale(1.03)} .fab:active{transform:scale(.96)}
.fab:focus-visible{outline:3px solid var(--c-bd);outline-offset:3px}

.hltbbox{display:grid;gap:8px;margin:-4px 0 16px;padding:12px;border-radius:14px;border:1px dashed var(--line-2);background:color-mix(in srgb,var(--glass) 60%,transparent)}

/* — affichage en liste — */
.vue-sw .chip{padding:6px 10px} .vue-sw .ic{width:15px;height:15px}

    background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--line-2);box-shadow:var(--shadow)}

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   A. CONSTANTES & UTILITAIRES
   ═══════════════════════════════════════════════════════════════════════ */
const CATS = {
  JEUX:  { label: 'Jeux vidéo',        court: 'Jeux',   unit: 'jeu',   icon: 'gamepad', blk: 'jeux',   obj: 'jeux'   },
  BD:    { label: 'Bandes dessinées',  court: 'BD',     unit: 'BD',    icon: 'bd',      blk: 'bd',     obj: 'bd'     },
  ROMAN: { label: 'Romans',            court: 'Romans', unit: 'roman', icon: 'book',    blk: 'romans', obj: 'romans' },
};
const CAT_LIST = ['JEUX', 'BD', 'ROMAN'];
const STATUTS = { non_commence: 'Non commencé', en_cours: 'En cours', termine: 'Terminé', abandonne: 'Abandonné', inconnu: 'Inconnu' };
const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const MOIS_LONG = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const PLAT_HUE = { PC: 205, PS5: 232, PS4: 222, PS3: 215, 'PS VITA': 250, SWITCH: 355, '3DS': 340, 'WII U': 195, XBOX: 140, 'XBOX ONE': 130, 'XBOX 360': 120, ANDROID: 100, IOS: 270 };
const NAV = [
  { id: 'accueil',      label: 'Accueil',        icon: 'home' },
  { id: 'jeux',         label: 'Jeux vidéo',     icon: 'gamepad', cat: 'JEUX' },
  { id: 'bd',           label: 'BD',             icon: 'bd',      cat: 'BD' },
  { id: 'romans',       label: 'Romans',         icon: 'book',    cat: 'ROMAN' },
  { id: 'series',       label: 'Séries',         icon: 'layers' },
  { id: 'tops',         label: 'Tops',           icon: 'star' },
  { id: 'abonnements',  label: 'Abonnements',    icon: 'repeat' },
  { id: 'achats',       label: 'Achats',         icon: 'cart' },
  { id: 'stats',        label: 'Statistiques',   icon: 'chart' },
  { id: 'historique',   label: 'Historique',     icon: 'history' },
  { id: 'export',       label: 'Export',         icon: 'upload' },
];
const TAB_MAIN = ['accueil', 'jeux', 'bd', 'romans', 'stats'];

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = n => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sum = a => a.reduce((x, y) => x + y, 0);
const fmtInt = n => Math.round(n).toLocaleString('fr-FR');
const fmtH = h => h == null ? '—' : (h >= 100 ? fmtInt(h) : String(Math.round(h * 10) / 10).replace('.', ',')) + ' h';
const fmtPct = p => Math.round(p * 100) + ' %';
const hash = s => { let h = 5381; for (const c of String(s)) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return Math.abs(h); };
const plural = (n, s, p) => `${fmtInt(n)} ${n > 1 ? (p || (/(eu|au)$/.test(s) ? s + 'x' : s + 's')) : s}`;   // jeu → jeux
const isoDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmtDate = iso => { if (!iso) return '—'; const [y, m, d] = iso.split('-').map(Number); return `${d} ${MOIS[m - 1]} ${y}`; };
const NOW = new Date();
const YEAR = NOW.getFullYear();
/** Part de l'année écoulée (1 pour une année passée, 0 pour une année future). */
const yearFrac = y => {
  if (y < YEAR) return 1; if (y > YEAR) return 0;
  const start = new Date(y, 0, 1), end = new Date(y + 1, 0, 1);
  return (NOW - start) / (end - start);
};
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/** Petit anneau de score (0-100) affiché à la place d'une jaquette. */
function sdial(score, cat, size = 46) {
  return `<div class="sdial" style="width:${size}px;height:${size}px" data-tip="Backlog Score : ${Math.round(score)} / 100">${ring({ size, stroke: 5, value: score / 100, cat, label: 'Backlog Score ' + Math.round(score) })}<b class="num">${Math.round(score)}</b></div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   B. DONNÉES : chargement, validation, sauvegarde
   ═══════════════════════════════════════════════════════════════════════
   Ordre de chargement : 1) fichier mémorisé (File System Access API)
                         2) fetch('data.json') (si servi en http)
                         3) écran d'accueil « Ouvrir data.json »
   Sauvegarde : écriture directe si un fichier est lié, sinon téléchargement. */
const S = {
  data: null, view: 'accueil', handle: null, dirty: false, linked: false, snapshot: null, _idx: null,
  f: { JEUX: { q: '', plat: new Set(), prio: new Set(), statut: 'tous', sort: 'score', vue: 'cartes' },
       BD: { q: '', statut: 'tous', sort: 'serie', vue: 'cartes' }, ROMAN: { q: '', statut: 'tous', sort: 'serie', vue: 'cartes' } },
  stats: { cat: 'ALL' }, histo: { q: '', f: 'tous' }, tops: { tab: null, cat: 'ALL', all: false }, achats: { etat: 'tous' }, series: { q: '', statut: 'tous' }, abos: { statut: 'tous' },
};
try { const v = JSON.parse(localStorage.getItem('cockpit.vues') || '{}'); for (const k in S.f) if (v[k] === 'liste' || v[k] === 'cartes') S.f[k].vue = v[k]; } catch { /* préférences d'affichage absentes */ }

/* — mémoire du fichier lié (IndexedDB) — */
const idb = {
  open: () => new Promise((ok, ko) => { const r = indexedDB.open('cockpit-backlog', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }),
  async get(k) { const db = await this.open(); return new Promise((ok, ko) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((ok, ko) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = ok; t.onerror = () => ko(t.error); }); },
};

/** Valide, répare ce qui peut l'être sans perte, et refuse un fichier abîmé (message clair).
    Protège aussi l'affichage : identifiants, statuts et avatar ne peuvent pas contenir de code. */
function parseData(text) {
  const d = JSON.parse(text);
  const fail = m => { throw new Error('Fichier non valide : ' + m); };
  const isObj = o => !!o && typeof o === 'object' && !Array.isArray(o);
  if (!isObj(d) || !isObj(d.backlog) || !Array.isArray(d.bibliotheque)) fail('il manque « backlog » ou « bibliotheque ».');
  for (const k of ['series', 'achats', 'abonnements']) if (d[k] != null && !Array.isArray(d[k])) fail(`« ${k} » devrait être une liste.`);
  for (const k of ['objectifs', 'tops', 'config', 'profil', 'meta']) if (d[k] != null && !isObj(d[k])) fail(`« ${k} » a un format inattendu.`);
  for (const k of ['jeux', 'bd', 'romans']) { if (d.backlog[k] != null && !Array.isArray(d.backlog[k])) fail(`« backlog.${k} » devrait être une liste.`); d.backlog[k] ||= []; }
  d.meta ||= {}; d.meta.rev = Number.isFinite(+d.meta.rev) ? +d.meta.rev : 0;
  d.config ||= {};
  const c = d.config;
  c.referenceHltb = ['main', 'mainPlus', 'complet'].includes(c.referenceHltb) ? c.referenceHltb : 'mainPlus';
  c.prioritesJeux ||= { 1: 'Indispensable', 2: 'À faire', 3: "Si j'ai le temps" };
  c.poidsScore ||= { priorite: 35, progression: 25, tempsRestant: 25, anciennete: 15 };
  c.valeursPriorite ||= { 1: 1, 2: 0.6, 3: 0.25, defaut: 0.5 };
  c.dureeParDefautH ||= { bd: 1, roman: 6 };
  d.objectifs ||= {}; d.series ||= []; d.achats ||= []; d.abonnements ||= []; d.tops ||= {}; d.profil ||= {};
  /* — réparations sans perte — */
  const used = new Set(), okId = v => typeof v === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(v);
  let fresh = 0; const fixId = (o, pre) => { if (!okId(o.id) || used.has(o.id)) { do { o.id = pre + 'x' + (++fresh); } while (used.has(o.id)); } used.add(o.id); };
  const str = (o, k, def = '') => { if (o[k] != null && typeof o[k] !== 'string') o[k] = String(o[k]); if (def !== null && (o[k] == null || o[k] === '')) o[k] = def; };
  const num = v => (v === '' || v == null || !Number.isFinite(+v)) ? null : +v;
  const oneOf = (v, list, def) => list.includes(v) ? v : def;
  const bad = [];
  for (const [k, pre] of [['jeux', 'g'], ['bd', 'b'], ['romans', 'r']]) d.backlog[k] = d.backlog[k].filter(isObj).map(it => {
    fixId(it, pre); str(it, 'titre', 'Sans titre'); it.statut = oneOf(it.statut, ['non_commence', 'en_cours'], 'non_commence'); it.priorite = num(it.priorite);
    if (k === 'jeux') { if (it.objectif != null && !['main', 'mainPlus', 'complet'].includes(it.objectif)) delete it.objectif; str(it, 'plateforme', 'AUTRE'); const h = isObj(it.hltb) ? it.hltb : {}; it.hltb = { main: num(h.main), mainPlus: num(h.mainPlus), complet: num(h.complet) }; it.tempsJoue = num(it.tempsJoue) || 0; }
    else { str(it, 'serie', null); it.tome = num(it.tome); }
    return it; });
  d.bibliotheque = d.bibliotheque.filter(isObj).map(b => {
    fixId(b, 'h'); str(b, 'titre', 'Sans titre'); str(b, 'support', null);
    if (!CATS[b.categorie]) bad.push(`${b.titre} (${String(b.categorie).slice(0, 20)})`);
    b.statut = oneOf(b.statut, ['termine', 'abandonne'], 'termine'); b.annee = num(b.annee) != null ? Math.trunc(num(b.annee)) : null;
    if (b.termineLe != null && !/^\d{4}-\d{2}-\d{2}$/.test(b.termineLe)) b.termineLe = null;
    if (b.note != null) { const n = num(b.note); if (n == null) delete b.note; else b.note = Math.max(0, Math.min(100, Math.round(n))); }
    if (b.avis != null && typeof b.avis !== 'string') b.avis = String(b.avis);
    if (b.tempsHeures != null) b.tempsHeures = num(b.tempsHeures);
    return b; });
  if (bad.length) fail(`catégorie inconnue pour ${bad.length > 1 ? bad.length + ' titres' : '1 titre'} de l’historique : ${bad.slice(0, 3).join(', ')}${bad.length > 3 ? '…' : ''}. Catégories possibles : JEUX, BD, ROMAN.`);
  d.achats = d.achats.filter(isObj).map(a => { fixId(a, 'a'); str(a, 'titre', 'Sans titre'); a.etat = oneOf(a.etat, ['commande', 'non_commande'], 'non_commande'); a.priorite = num(a.priorite); return a; });
  d.series = d.series.filter(isObj).map(x => { str(x, 'nom', 'Série sans nom'); x.statut = oneOf(x.statut, Object.keys(STATUTS), 'inconnu'); x.tomeAchete = num(x.tomeAchete); return x; });
  d.abonnements = d.abonnements.filter(isObj).map(a => { str(a, 'service', 'Abonnement'); a.statut = oneOf(a.statut, ['abonne', 'resilie'], 'abonne'); a.prix = num(a.prix); return a; });
  for (const y of Object.keys(d.objectifs)) { const o = d.objectifs[y]; if (!/^\d{4}$/.test(y) || !isObj(o)) { delete d.objectifs[y]; continue; } for (const k of Object.keys(o)) { const n = num(o[k]); o[k] = n == null || n < 0 ? null : Math.round(n); } }
  for (const k of Object.keys(d.tops)) {
    const v = d.tops[k]; if (k === 'majLe') continue;
    if (typeof v === 'string') d.tops[k] = [{ rang: 1, titre: v }];
    else if (!Array.isArray(v)) delete d.tops[k];
    else d.tops[k] = v.filter(isObj).map((t, i) => ({ ...t, rang: num(t.rang) ?? i + 1, titre: String(t.titre ?? '') }));
  }
  str(d.profil, 'pseudo', null); d.profil.pseudo ??= 'Shiwo';
  if (!('avatar' in d.profil)) d.profil.avatar = DEFAULT_AVATAR;
  else if (d.profil.avatar != null && !/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(d.profil.avatar)) d.profil.avatar = null;
  if (d.meta.derniereSauvegarde != null && !/^\d{4}-\d{2}-\d{2}$/.test(d.meta.derniereSauvegarde)) delete d.meta.derniereSauvegarde;
  return d;
}

/** Sérialisation lisible : un élément par ligne pour les longues listes. */
function ser(o, ind = 0) {
  const pad = '  '.repeat(ind), flat = JSON.stringify(o);
  if (ind > 0 && flat.length <= 230) return flat;
  if (Array.isArray(o)) return '[\n' + o.map(x => pad + '  ' + ser(x, ind + 1)).join(',\n') + '\n' + pad + ']';
  if (o && typeof o === 'object') return '{\n' + Object.entries(o).map(([k, v]) => `${pad}  ${JSON.stringify(k)}: ${ser(v, ind + 1)}`).join(',\n') + '\n' + pad + '}';
  return flat;
}

async function loadData() {
  if (syncOn()) {                                              // données hébergées sur GitHub : source de vérité
    try {
      const r = await ghRead(); SY.sha = r.sha;
      if (r.text) { S.linked = true; setSync('ok'); return parseData(r.text); }
      return null;                                             // dépôt encore vide : l'écran d'accueil propose d'y envoyer data.json
    } catch (e) {
      try { const dr = JSON.parse(localStorage.getItem('cockpit.draft') || 'null'); if (dr && dr.meta) { S.linked = true; S.dirty = true; setSync(e.code === 'net' ? 'offline' : 'error'); return parseData(JSON.stringify(dr)); } } catch { /* pas de brouillon */ }
      S.loadError = e.message; toast(e.message + ' — impossible de charger les données depuis GitHub.'); return null;
    }
  }
  try { S.handle = await idb.get('handle') || null; } catch { S.handle = null; }
  if (S.handle) {
    try {
      if (await S.handle.queryPermission({ mode: 'readwrite' }) === 'granted') {
        const d = parseData(await (await S.handle.getFile()).text()); S.linked = true; return d;
      }
    } catch (e) { console.warn('Fichier lié inaccessible', e); if (/non valide|JSON/.test(e.message)) { S.loadError = e.message; toast(e.message); } }
  }
  let txt = null;
  try { const r = await fetch('data.json', { cache: 'no-store' }); if (r.ok) txt = await r.text(); } catch (e) { /* ouverture en file:// : écran d'accueil */ }
  if (txt != null) { try { return parseData(txt); } catch (e) { S.loadError = e.message; toast('data.json illisible : ' + e.message); } }
  return null;
}

async function openPicked(file, handle) {
  try {
    const d = parseData(await file.text());
    if (syncOn() && S.data) return restoreCompare(d, `le fichier « ${file.name} »`);   // synchro active : on compare avant d'écraser GitHub
    if (handle) { S.handle = handle; S.linked = true; idb.set('handle', handle).catch(() => {}); }
    start(d);
    if (syncOn()) { S.dirty = true; paintSave(); pushNow(true); }       // premier envoi vers GitHub
  } catch (e) { toast('Impossible de lire ce fichier : ' + e.message); }
}
async function pickFile() {
  if (window.showOpenFilePicker) {
    try {
      const [h] = await showOpenFilePicker({ types: [{ description: 'Données du Backlog', accept: { 'application/json': ['.json'] } }] });
      await h.requestPermission?.({ mode: 'readwrite' });
      await openPicked(await h.getFile(), h);
    } catch (e) { if (e.name !== 'AbortError') toast('Ouverture impossible : ' + e.message); }
  } else $('#file-input').click();
}
async function resumeLinked() {
  try {
    if (await S.handle.requestPermission({ mode: 'readwrite' }) === 'granted') await openPicked(await S.handle.getFile(), S.handle);
  } catch (e) { toast('Accès refusé : ' + e.message); }
}

/* — modification & sauvegarde — */
const writeDraft = debounce(() => { try { localStorage.setItem('cockpit.draft', JSON.stringify(S.data)); } catch { /* quota */ } }, 400);
const autosave = debounce(async () => {
  if (syncOn()) { syncSoon(); return; }
  if (!S.handle || !S.dirty) return;
  try { if (await S.handle.queryPermission({ mode: 'readwrite' }) === 'granted') await writeFile(); } catch { /* reste « non enregistré » */ }
}, 900);

/** À appeler après toute modification de S.data. `undoable` garde un instantané pour « Annuler ». */
function commit(msg, undoable = false) {
  S.data.meta.rev++; S.data.meta.majLe = isoDate(); S._idx = null; S.dirty = true;
  paintSave(); writeDraft(); autosave(); render();
  if (msg) toast(msg, undoable ? undoLast : null);
}
/** À appeler AVANT une modification annulable. */
const snap = () => { S.snapshot = JSON.stringify(S.data); };

async function writeFile() {
  const w = await S.handle.createWritable(); await w.write(ser(S.data) + '\n'); await w.close();
  S.dirty = false; S.linked = true; localStorage.removeItem('cockpit.draft'); paintSave();
}
async function save() {
  if (syncOn()) { pushNow(true); return; }
  if (S.handle) {
    try {
      let p = await S.handle.queryPermission({ mode: 'readwrite' });
      if (p !== 'granted') p = await S.handle.requestPermission({ mode: 'readwrite' });
      if (p === 'granted') { await writeFile(); toast('Enregistré dans ' + S.handle.name); return; }
    } catch (e) { console.warn(e); }
  }
  if (window.showSaveFilePicker) {
    try {
      S.handle = await showSaveFilePicker({ suggestedName: 'data.json', types: [{ description: 'Données du Backlog', accept: { 'application/json': ['.json'] } }] });
      idb.set('handle', S.handle).catch(() => {}); await writeFile(); toast('Enregistré dans ' + S.handle.name); return;
    } catch (e) { if (e.name === 'AbortError') return; console.warn(e); }
  }
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([ser(S.data) + '\n'], { type: 'application/json' })), download: 'data.json' });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  S.dirty = false; localStorage.removeItem('cockpit.draft'); paintSave();
  toast('data.json téléchargé : remplace l’ancien fichier dans ton dossier.');
}
function paintSave() {
  const p = $('#savepill'); if (!p) return;
  if (syncOn()) {
    const st = SY.state, bad = st === 'conflict' || st === 'error';
    p.classList.toggle('dirty', S.dirty && !bad); p.classList.toggle('bad', bad);
    $('#savetxt').textContent = bad ? (st === 'conflict' ? 'Conflit' : 'Erreur de synchro') : st === 'offline' ? 'Hors ligne' : (st === 'push' || S.dirty) ? 'Synchronisation…' : 'Synchronisé';
    return;
  }
  p.classList.remove('bad'); p.classList.toggle('dirty', S.dirty);
  $('#savetxt').textContent = S.dirty ? (S.linked ? 'Enregistrement…' : 'Non enregistré') : (S.linked ? 'Enregistré' : 'À jour');
}
window.addEventListener('beforeunload', e => { if (S.dirty && (!S.linked || syncOn())) { e.preventDefault(); e.returnValue = ''; } });

/* ═══════════════════════════════════════════════════════════════════════
   B2. SYNCHRONISATION GITHUB
   data.json vit dans un dépôt privé ; la page le lit et le réécrit via l'API
   de GitHub avec un jeton propre à chaque appareil (jamais écrit dans data.json).
   ═══════════════════════════════════════════════════════════════════════ */
const SY = { sha: null, state: 'off', busy: false, again: false, lastPull: 0 };   // state : off | ok | wait | push | offline | conflict | error
const syncCfg = () => { try { const c = JSON.parse(localStorage.getItem('cockpit.sync') || 'null'); return c && c.repo && c.token ? c : null; } catch { return null; } };
const syncOn = () => !!syncCfg();
const b64enc = s => { const u = new TextEncoder().encode(s); let b = ''; for (let i = 0; i < u.length; i += 0x8000) b += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(b); };
const b64dec = s => { const b = atob(s.replace(/\s/g, '')), u = Uint8Array.from(b, c => c.charCodeAt(0)); return new TextDecoder().decode(u); };

async function gh(method, body, raw, ref) {
  const c = syncCfg(); if (!c) throw Object.assign(new Error('Synchronisation non configurée'), { code: 'cfg' });
  const url = `https://api.github.com/repos/${c.repo}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}` + (method === 'GET' ? `?ref=${encodeURIComponent(ref || c.branch)}` : '');
  let r;
  try {
    r = await fetch(url, { method, cache: 'no-store', body: body ? JSON.stringify(body) : undefined,
      headers: { Authorization: 'Bearer ' + c.token, Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) } });
  } catch { throw Object.assign(new Error('Pas de connexion'), { code: 'net' }); }
  noteTokenExpiry(r);
  if (!r.ok) {
    const msg = { 401: 'Jeton refusé ou expiré', 403: 'Accès refusé (droits du jeton ?)', 404: 'Fichier ou dépôt introuvable', 409: 'Conflit', 422: 'Conflit' }[r.status] || ('Erreur GitHub ' + r.status);
    throw Object.assign(new Error(msg), { code: r.status });
  }
  return r;
}
/** GitHub indique la date d'expiration du jeton dans chaque réponse (si le navigateur la laisse lire). */
function noteTokenExpiry(r) {
  const h = r.headers.get('github-authentication-token-expiration'); if (!h) return;
  const iso = h.slice(0, 10), c = syncCfg(); if (!c || c.expire === iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
  c.expire = iso; c.expireAuto = true; localStorage.setItem('cockpit.sync', JSON.stringify(c)); paintNotices?.();
}
/** Contenu de data.json tel qu'il était dans une version donnée (sha de commit). */
async function ghReadAt(ref) {
  const j = await (await gh('GET', null, false, ref)).json();
  return j.content ? b64dec(j.content) : await (await gh('GET', null, true, ref)).text();
}
/** Dernières versions enregistrées de data.json (une par envoi). */
async function ghVersions(n = 40) {
  const c = syncCfg(); let r;
  try { r = await fetch(`https://api.github.com/repos/${c.repo}/commits?path=${encodeURIComponent(c.path)}&sha=${encodeURIComponent(c.branch)}&per_page=${n}`, { cache: 'no-store', headers: { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json' } }); }
  catch { throw Object.assign(new Error('Pas de connexion'), { code: 'net' }); }
  noteTokenExpiry(r);
  if (!r.ok) throw Object.assign(new Error(r.status === 401 ? 'Jeton refusé ou expiré' : 'Erreur GitHub ' + r.status), { code: r.status });
  return (await r.json()).map(x => ({ sha: x.sha, date: x.commit?.committer?.date || x.commit?.author?.date, msg: x.commit?.message || '' }));
}
/** Lit data.json dans le dépôt. Retourne { sha, text } ; text vaut null si le fichier n'existe pas encore. */
async function ghRead() {
  try {
    const j = await (await gh('GET')).json();
    const text = j.content ? b64dec(j.content) : await (await gh('GET', null, true)).text();      // > 1 Mo : lecture brute
    return { sha: j.sha, text };
  } catch (e) { if (e.code === 404) { const c = syncCfg(); if (c && await repoExists()) return { sha: null, text: null }; } throw e; }
}
async function repoExists() { const c = syncCfg(); try { return (await fetch('https://api.github.com/repos/' + c.repo, { headers: { Authorization: 'Bearer ' + c.token } })).ok; } catch { return false; } }
async function ghWrite(text, sha) {
  const c = syncCfg(), r = await gh('PUT', { message: 'Backlog · rév. ' + (S.data?.meta?.rev ?? '?') + ' · ' + new Date().toISOString().slice(0, 16).replace('T', ' '), content: b64enc(text), branch: c.branch, ...(sha ? { sha } : {}) });
  return (await r.json()).content.sha;
}

function setSync(state) { SY.state = state; paintSave(); }

/** Envoie l'état courant. Appelée après chaque modification (avec délai) et par « Enregistrer ». */
async function pushNow(manual) {
  if (!syncOn() || !S.data) return;
  if (SY.busy) { SY.again = true; return; }
  if (!S.dirty && !manual) return;
  SY.busy = true; setSync('push');
  try {
    const rev = S.data.meta.rev;
    SY.sha = await ghWrite(ser(S.data) + '\n', SY.sha);
    if (S.data.meta.rev === rev) { S.dirty = false; localStorage.removeItem('cockpit.draft'); }
    S.linked = true; setSync('ok'); if (manual) toast('Synchronisé avec GitHub');
  } catch (e) {
    if (e.code === 409 || e.code === 422) { setSync('conflict'); conflictBanner(); }
    else { setSync(e.code === 'net' ? 'offline' : 'error'); if (manual || e.code !== 'net') toast(e.message + (e.code === 'net' ? ' : les modifications sont gardées sur cet appareil et partiront au retour du réseau.' : '')); }
  } finally { SY.busy = false; if (SY.again) { SY.again = false; syncSoon(); } }
}
const syncSoon = debounce(() => pushNow(false), 3000);   // regroupe les modifications rapprochées en un seul envoi

/** Va chercher les changements faits ailleurs (retour sur l'onglet, reconnexion). */
async function pullIfNewer(force) {
  if (!syncOn() || !S.data || SY.busy || SY.state === 'conflict') return;
  if (!force && Date.now() - SY.lastPull < 15000) return; SY.lastPull = Date.now();
  try {
    const r = await ghRead(); if (!r.text || r.sha === SY.sha) { if (SY.state === 'offline' || SY.state === 'error') setSync(S.dirty ? 'wait' : 'ok'); if (S.dirty) pushNow(false); return; }
    if (S.dirty) { SY.remote = r; setSync('conflict'); conflictBanner(); return; }
    const d = parseData(r.text); SY.sha = r.sha; S.data = d; S._idx = null; S.dirty = false; resetUndo(); setSync('ok'); render(); toast('Données mises à jour depuis GitHub');
  } catch (e) { setSync(e.code === 'net' ? 'offline' : 'error'); }
}
function conflictBanner(msg = 'Un autre appareil a modifié les données pendant que tu travaillais ici.') {
  $('#banner').innerHTML = `<div class="banner">${ic('save')}<span>${esc(msg)}</span><span class="spacer"></span><button class="btn sm" id="cf-remote">Garder la version GitHub</button><button class="btn sm ghost" id="cf-local">Écraser avec la mienne</button></div>`;
  $('#cf-remote').onclick = async () => {
    try { const r = await ghRead(); S.data = parseData(r.text); SY.sha = r.sha; S._idx = null; S.dirty = false; resetUndo(); localStorage.removeItem('cockpit.draft'); $('#banner').innerHTML = ''; setSync('ok'); render(); toast('Version GitHub rechargée'); } catch (e) { toast(e.message); }
  };
  $('#cf-local').onclick = async () => {
    try { const r = await ghRead(); SY.sha = r.sha; $('#banner').innerHTML = ''; setSync('wait'); S.dirty = true; await pushNow(true); } catch (e) { toast(e.message); }
  };
}
const BOOT_DAY = isoDate();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (syncOn() && S.dirty) pushNow(false); return; }   // on quitte l'appli : envoi immédiat
  if (isoDate() !== BOOT_DAY && !S.dirty && !$('#modal-root').innerHTML) { location.reload(); return; }   // nouveau jour : année, objectifs, salutation à jour
  pullIfNewer(false);
});
window.addEventListener('online', () => pullIfNewer(true));

/** Teste la configuration saisie. Retourne un message d'erreur ou null. */
async function syncTest(cfg) {
  const old = localStorage.getItem('cockpit.sync');
  try {
    localStorage.setItem('cockpit.sync', JSON.stringify(cfg));
    const r = await fetch('https://api.github.com/repos/' + cfg.repo, { headers: { Authorization: 'Bearer ' + cfg.token } });
    if (r.status === 401) throw new Error('Jeton refusé : vérifie qu’il est complet et qu’il n’a pas expiré.');
    if (r.status === 404) throw new Error('Dépôt introuvable : vérifie « pseudo/nom-du-dépôt » et que le jeton a accès à ce dépôt.');
    if (!r.ok) throw new Error('GitHub répond ' + r.status);
    const hx = r.headers.get('github-authentication-token-expiration'); if (hx) { cfg.expire = hx.slice(0, 10); cfg.expireAuto = true; }
    const j = await r.json(); if (j.permissions && !j.permissions.push) throw new Error('Ce jeton peut lire mais pas écrire : donne-lui « Contents : Read and write ».');
    return null;
  } catch (e) { if (old) localStorage.setItem('cockpit.sync', old); else localStorage.removeItem('cockpit.sync'); return e.code === 'net' || e instanceof TypeError ? 'Pas de connexion à GitHub.' : e.message; }
}
function syncFormHTML(c = {}) {
  return `<form data-form="sync" autocomplete="off">
    <div class="field"><label for="sy-repo">Dépôt privé des données</label><input class="input" id="sy-repo" name="repo" placeholder="ton-pseudo/backlog-data" value="${esc(c.repo || '')}" required autocapitalize="off" spellcheck="false"></div>
    <div class="field" style="margin-top:10px"><label for="sy-token">Jeton d’accès</label><input class="input" id="sy-token" name="token" type="password" placeholder="github_pat_…" value="${esc(c.token || '')}" required autocapitalize="off" spellcheck="false"><span class="hint">Il reste sur cet appareil, jamais dans data.json.</span></div>
    <details style="margin-top:10px"><summary class="muted" style="cursor:pointer;font-size:.88rem">Options</summary>
      <div class="two" style="margin-top:8px"><div class="field"><label for="sy-path">Fichier</label><input class="input" id="sy-path" name="path" value="${esc(c.path || 'data.json')}" autocapitalize="off"></div>
      <div class="field"><label for="sy-br">Branche</label><input class="input" id="sy-br" name="branch" value="${esc(c.branch || 'main')}" autocapitalize="off"></div></div>
      <div class="field"><label for="sy-exp">Expiration du jeton</label><input class="input" id="sy-exp" name="expire" type="date" value="${esc(c.expire || '')}"><span class="hint">Remplie automatiquement si GitHub la communique. Sert à te prévenir 30 jours avant.</span></div></details>
    <div class="row" style="margin-top:14px"><button class="btn primary" type="submit">${ic('save')}${c.repo ? 'Mettre à jour' : 'Connecter'}</button><span class="muted" id="sy-msg" style="font-size:.88rem"></span></div></form>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   C. CALCULS : index, statistiques, objectifs, Backlog Score
   Rien de ce qui est calculé n'est stocké dans data.json.
   ═══════════════════════════════════════════════════════════════════════ */
const blk = cat => S.data.backlog[CATS[cat].blk];

/** Temps HLTB de référence d'un jeu : son objectif propre (« objectif »), sinon le réglage général, avec repli sur les autres valeurs. */
const HLTB_KEYS = ['main', 'mainPlus', 'complet'];
const HLTB_LAB = { main: 'Main', mainPlus: 'Main +', complet: '100 %' };
const HLTB_LONG = { main: 'Main Story', mainPlus: 'Main + Side', complet: '100 %' };
const objOf = g => HLTB_KEYS.includes(g.objectif) ? g.objectif : S.data.config.referenceHltb;
function refKey(g) {
  const h = g.hltb || {};
  for (const k of [objOf(g), 'mainPlus', 'main', 'complet']) if (h[k] != null) return k;
  return null;
}
const refH = g => { const k = refKey(g); return k ? g.hltb[k] : null; };
/** Avancement = temps joué / temps de référence (plafonné à 100 %). */
const pctGame = g => { const r = refH(g); return r ? clamp((g.tempsJoue || 0) / r, 0, 1) : 0; };
const restantGame = g => { const r = refH(g); return r == null ? null : Math.max(r - (g.tempsJoue || 0), 0); };

/** Index de l'historique, recalculé seulement après une modification. */
function idx() {
  if (S._idx) return S._idx;
  const I = { byYear: {}, byMonth: {}, plat: {}, lib: {}, years: new Set(), hours: 0, hoursN: 0, undated: { JEUX: 0, BD: 0, ROMAN: 0 }, rank: {} };
  for (const c of CAT_LIST) I.lib[c] = { termine: 0, abandonne: 0 };
  for (const b of S.data.bibliotheque) {
    const L = I.lib[b.categorie]; if (!L) continue;
    if (b.statut === 'abandonne') L.abandonne++;
    else if (b.statut === 'termine') {
      L.termine++;
      if (b.tempsHeures != null) { I.hours += b.tempsHeures; I.hoursN++; }
      if (b.annee) {
        I.years.add(b.annee);
        (I.byYear[b.annee] ||= { JEUX: 0, BD: 0, ROMAN: 0 })[b.categorie]++;
        if (b.termineLe && +b.termineLe.slice(0, 4) === b.annee) {
          const m = +b.termineLe.slice(5, 7) - 1;
          (I.byMonth[b.annee] ||= Array.from({ length: 12 }, () => ({ JEUX: 0, BD: 0, ROMAN: 0 })))[m][b.categorie]++;
        }
      } else I.undated[b.categorie]++;
    }
    if (b.categorie === 'JEUX') {
      const o = (I.plat[b.support || 'Autre'] ||= { termine: 0, abandonne: 0 });
      if (b.statut === 'abandonne') o.abandonne++; else if (b.statut === 'termine') o.termine++;
    }
  }
  return (S._idx = I);
}
const yearsList = () => { const s = new Set([...idx().years, YEAR, ...Object.keys(S.data.objectifs).map(Number)]); return [...s].sort((a, b) => b - a); };
const doneYear = (y, cat) => idx().byYear[y]?.[cat] || 0;
const goalOf = (y, cat) => S.data.objectifs[y]?.[CATS[cat].obj] ?? null;

/** Objectif annuel : réalisé, % atteint, rythme attendu à date, projection fin d'année. */
function pace(y, cat) {
  const o = goalOf(y, cat), done = doneYear(y, cat), f = yearFrac(y);
  if (!o) return { o: null, done, f };
  const expected = o * f;
  return { o, done, f, expected, diff: done - expected, proj: f > 0 ? done / f : done, pct: done / o };
}

/* — Backlog Score —
   Score 0–100 = moyenne pondérée de 4 critères (poids réglables dans config.poidsScore) :
     priorité     : 1 → 100 %, 2 → 60 %, 3 → 25 %, sans priorité → 50 % (config.valeursPriorite)
     progression  : temps joué / temps de référence (favorise ce qui est déjà entamé)
     tempsRestant : 1 / (1 + heures restantes / 20) → les titres courts passent devant
     ancienneté   : jours depuis « ajouteLe », plafonné à 1 an
   Pour les BD / romans d'une série, seul le plus petit tome non lu est proposé. */
function seriesMin(cat) {
  const m = {};
  for (const b of blk(cat)) if (b.serie && b.tome != null) { const k = norm(b.serie); m[k] = Math.min(m[k] ?? Infinity, b.tome); }
  return m;
}
function scoreOf(item, cat, mins) {
  const c = S.data.config, w = c.poidsScore, vp = c.valeursPriorite;
  const prio = vp[item.priorite] ?? vp.defaut ?? 0.5;
  let prog, rest;
  if (cat === 'JEUX') {
    prog = pctGame(item) || (item.statut === 'en_cours' ? 0.15 : 0);
    rest = refH(item) == null ? null : restantGame(item);
  } else {
    const half = item.statut === 'en_cours';
    prog = half ? 0.5 : 0;
    rest = (c.dureeParDefautH[cat === 'BD' ? 'bd' : 'roman'] ?? 1) * (half ? 0.5 : 1);
  }
  const temps = rest == null ? 0.5 : 1 / (1 + rest / 20);
  const days = item.ajouteLe ? Math.max(0, (NOW - new Date(item.ajouteLe)) / 864e5) : 0;
  const anc = clamp(days / 365, 0, 1);
  const tot = (w.priorite + w.progression + w.tempsRestant + w.anciennete) || 1;
  const score = 100 * (w.priorite * prio + w.progression * prog + w.tempsRestant * temps + w.anciennete * anc) / tot;
  const eligible = cat === 'JEUX' || !item.serie || item.tome == null || item.statut === 'en_cours' || item.tome === mins[norm(item.serie)];
  return { score, parts: { priorite: prio, progression: prog, temps, anciennete: anc }, rest, eligible };
}
/** Backlog d'une catégorie classé par score décroissant. */
function ranked(cat) {
  const I = idx(); if (I.rank[cat]) return I.rank[cat];
  const mins = cat === 'JEUX' ? null : seriesMin(cat);
  return (I.rank[cat] = blk(cat).map(it => ({ it, cat, ...scoreOf(it, cat, mins) })).sort((a, b) => b.score - a.score));
}
const suggestion = cat => ranked(cat).find(x => x.eligible) || null;
const scoreMap = cat => new Map(ranked(cat).map(x => [x.it.id, x]));

/** Indicateurs globaux (reprend et étend les compteurs de l'Excel). */
function overview() {
  const I = idx(), d = S.data, gB = d.backlog.jeux, en = gB.filter(g => g.statut === 'en_cours');
  const L = I.lib, tot = c => blk(c).length + L[c].termine + L[c].abandonne;
  const ownHours = sum(gB.map(g => g.tempsJoue || 0));
  return {
    jeux: {
      possedes: tot('JEUX'), termines: L.JEUX.termine, enCours: en.length, abandonnes: L.JEUX.abandonne, backlog: gB.length,
      nonCommences: gB.length - en.length,
      tempsRestant: sum(gB.map(g => restantGame(g) || 0)), tempsTotal: sum(gB.map(g => refH(g) || 0)),
      sansTemps: gB.filter(g => refH(g) == null).length,
      tempsJoueBacklog: ownHours, tempsJoue: ownHours + I.hours, avecDuree: I.hoursN,
      progMoy: en.length ? sum(en.map(pctGame)) / en.length : 0,
      progBacklog: gB.length ? sum(gB.map(pctGame)) / gB.length : 0,
    },
    bd:    { possedes: tot('BD'),    lues: L.BD.termine,    restantes: blk('BD').length,    enCours: blk('BD').filter(b => b.statut === 'en_cours').length, abandonnees: L.BD.abandonne },
    roman: { possedes: tot('ROMAN'), lus: L.ROMAN.termine, restants: blk('ROMAN').length, enCours: blk('ROMAN').filter(b => b.statut === 'en_cours').length, abandonnes: L.ROMAN.abandonne },
    histo: { jeux: L.JEUX.termine, bd: L.BD.termine, romans: L.ROMAN.termine, heures: I.hours, heuresN: I.hoursN, annees: I.years.size },
  };
}

/** Abonnements : équivalent mensuel de ceux marqués « abonné » (comme le total de l'Excel). */
function abonnementsTotal() {
  const a = S.data.abonnements.filter(x => x.statut === 'abonne');

/* ═══════════════════════════════════════════════════════════════════════
   D. GRAPHIQUES (SVG générés à la main, aucune bibliothèque)
   Les infobulles viennent de l'attribut data-tip (voir section G).
   ═══════════════════════════════════════════════════════════════════════ */
const platColor = p => `hsl(${PLAT_HUE[p] ?? hash(p) % 360} 72% 64%)`;

/** Anneau de progression. `pace` (0–1) dessine un repère : où l'on devrait en être. */
function ring({ size = 120, stroke = 12, value = 0, cat, pace = null, label = '' }) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, v = clamp(value, 0, 1), c = size / 2;
  let tick = '';
  if (pace != null && pace > 0 && pace < 1) {
    const a = pace * 2 * Math.PI - Math.PI / 2, r1 = r - stroke / 2 - 3, r2 = r + stroke / 2 + 3;
    tick = `<line x1="${c + r1 * Math.cos(a)}" y1="${c + r1 * Math.sin(a)}" x2="${c + r2 * Math.cos(a)}" y2="${c + r2 * Math.sin(a)}" stroke="var(--tx)" stroke-width="2.5" stroke-linecap="round" data-tip="Rythme attendu à date : ${Math.round(pace * 100)} %"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--glass-3)" stroke-width="${stroke}"/>
    <circle class="ring-p s-${cat}" cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C * (1 - v)}" transform="rotate(-90 ${c} ${c})"/>${tick}</svg>`;
}
/** Lance l'animation des anneaux après insertion dans le DOM. */
function animateRings(root = document) {
  requestAnimationFrame(() => requestAnimationFrame(() => $$('.ring-p[data-off]', root).forEach(el => { el.style.strokeDashoffset = el.dataset.off; })));
}

/** Anneau segmenté : items = [{label, value, color}]. */
function donut(items, { size = 168, stroke = 22, center = '' } = {}) {
  const tot = sum(items.map(i => i.value)), r = (size - stroke) / 2, C = 2 * Math.PI * r, c = size / 2;
  if (!tot) return `<div class="empty">Aucune donnée</div>`;
  let acc = 0;
  const segs = items.filter(i => i.value > 0).map(i => {
    const len = i.value / tot * C, gap = items.length > 1 ? Math.min(3, len * .3) : 0;
    const s = `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${i.color}" stroke-width="${stroke}" stroke-dasharray="${Math.max(len - gap, 0.1)} ${C}" stroke-dashoffset="${-acc}" data-tip="${esc(i.label)} : ${fmtInt(i.value)} (${Math.round(i.value / tot * 100)} %)" style="transition:opacity .2s" onmouseover="this.style.opacity=.75" onmouseout="this.style.opacity=1"/>`;
    acc += len; return s;
  }).join('');
  return `<div style="position:relative;width:${size}px;height:${size}px;flex:none"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">${segs}</svg>
    <div style="position:absolute;inset:0;display:grid;place-content:center;text-align:center">${center}</div></div>`;
}
const legend = items => `<div class="legend">${items.map(i => `<span><i style="--lc:${i.color}"></i>${esc(i.label)}${i.value != null ? ` <b class="num" style="color:var(--tx)">${fmtInt(i.value)}</b>` : ''}</span>`).join('')}</div>`;

/** Barres horizontales HTML : items = [{label, value, color, text?}]. */
function hbars(items, max) {
  max ||= Math.max(...items.map(i => i.value), 1);
  return items.map(i => `<div class="hb" data-tip="${esc(i.tip || i.label + ' : ' + (i.text ?? fmtInt(i.value)))}"><span class="l">${esc(i.label)}</span><div class="bar"><i style="--w:${clamp(i.value / max * 100, 0, 100)}%;--col:${i.color}"></i></div><b class="num">${i.text ?? fmtInt(i.value)}</b></div>`).join('');
}

/** Colonnes empilées Jeux / BD / Romans.
    data = [{label, vals:{JEUX,BD,ROMAN}, goal:number|null, tip}] ; cats = catégories affichées. */
function columns(data, cats, { height = 250, width = null } = {}) {
  const n = data.length, W = width || Math.max(560, n * 46), H = height, pl = 34, pb = 26, pt = 14, iw = W - pl - 8, ih = H - pb - pt;
  const tot = d => sum(cats.map(c => d.vals[c] || 0));
  let max = Math.max(...data.map(d => Math.max(tot(d), d.goal || 0)), 4);
  const step = max <= 8 ? 2 : max <= 20 ? 5 : max <= 60 ? 10 : max <= 160 ? 20 : 50; max = Math.ceil(max / step) * step;
  const y = v => pt + ih - v / max * ih, bw = iw / n * .62, x = i => pl + iw / n * (i + .5);
  let g = '';
  for (let v = 0; v <= max; v += step) g += `<line class="grid-l" x1="${pl}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  let bars = '';
  data.forEach((d, i) => {
    let acc = 0, seg = '';
    for (const c of cats) {
      const v = d.vals[c] || 0; if (!v) continue;
      seg += `<rect class="f-${c}" x="${x(i) - bw / 2}" y="${y(acc + v)}" width="${bw}" height="${Math.max(y(acc) - y(acc + v), 0)}" rx="${Math.min(5, bw / 4)}"/>`; acc += v;
    }
    const goal = d.goal ? `<line x1="${x(i) - bw / 2 - 4}" x2="${x(i) + bw / 2 + 4}" y1="${y(d.goal)}" y2="${y(d.goal)}" stroke="var(--tx)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 5"/>` : '';
    bars += `<g class="bar-r" data-tip="${esc(d.tip)}"><rect x="${x(i) - iw / n / 2}" y="${pt}" width="${iw / n}" height="${ih}" fill="transparent"/>${seg}${goal}</g><text x="${x(i)}" y="${H - 7}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${Math.min(W, 520)}px;height:auto" role="img">${g}${bars}</svg></div>`;
}

/** Courbe simple : points = [{label, value, tip}] ; ligne pointillée à `ref`. */
function lineChart(points, { color = 'var(--c-jeux)', ref = null, fmt = v => v, height = 190 } = {}) {
  if (points.length < 2) return `<div class="empty">Pas assez de données</div>`;
  const W = 520, H = height, pl = 44, pb = 24, pt = 12, iw = W - pl - 26, ih = H - pb - pt;
  const raw = Math.max(...points.map(p => p.value), ref || 0) * 1.05;
  const step = [0.1, 0.2, 0.25, 0.5, 1, 2, 5, 10, 20, 25, 50, 100].find(s => raw / s <= 5) || 100, max = Math.ceil(raw / step) * step || 1;
  const x = i => pl + iw * i / (points.length - 1), y = v => pt + ih - v / max * ih;
  const pts = points.map((p, i) => `${x(i)},${y(p.value)}`).join(' ');
  const area = `${x(0)},${y(0)} ${pts} ${x(points.length - 1)},${y(0)}`;
  let g = ''; for (let v = 0; v <= max + 1e-9; v += step) { g += `<line class="grid-l" x1="${pl}" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; }
  const r = ref != null ? `<line x1="${pl}" x2="${W - 10}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--tx3)" stroke-dasharray="4 5"/>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${g}${r}<polygon points="${area}" fill="url(#lg)"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.value)}" r="4.5" fill="var(--bg)" stroke="${color}" stroke-width="2.5" data-tip="${esc(p.tip)}"/><text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(p.label)}</text>`).join('')}</svg>`;
}

/** Case Main / Main + / 100 % : un clic en fait l'objectif de ce jeu (re-clic sur l'objectif choisi = retour au réglage par défaut). */
function hltbCell(g, k, l, keyRef = refKey(g)) {

}

function filterJeux() {

  const nul = (a, b, dir = 1) => (a ?? Infinity) === (b ?? Infinity) ? 0 : ((a ?? Infinity) - (b ?? Infinity)) * dir;
  const sorts = { score: (a, b) => b.score - a.score, titre: (a, b) => a.it.titre.localeCompare(b.it.titre, 'fr'),

/* ───────────── Historique ───────────── */
/** Filtre de l'historique : recherche + « notés / à noter ». */
const histOk = (b, q) => (!q || matches(b.titre, q)) && (S.histo.f === 'tous' || (S.histo.f === 'notes' ? noteOf(b) != null : (noteOf(b) == null && b.statut === 'termine')));
function yearBody(y, q) {
  const l = S.data.bibliotheque.filter(b => (y === 0 ? !b.annee : b.annee === y) && (y !== 0 ? b.statut === 'termine' : true) && histOk(b, q));
  const col = c => {
    const it = l.filter(b => b.categorie === c).sort((a, b) => (a.termineLe || '9').localeCompare(b.termineLe || '9') || a.titre.localeCompare(b.titre, 'fr'));
    return `<div class="k-${c}"><h3 style="color:var(--acc);margin-bottom:6px">${CATS[c].court} · ${it.length}</h3><ul class="tlist">${it.map(b => {
      const d = b.termineLe ? b.termineLe.slice(8, 10) + '/' + b.termineLe.slice(5, 7) : '—';
      const fl = (b.flags || []).find(f => f.startsWith('date_')); 
      return `<li class="rateable ${fl ? 'fl' : ''}" data-act="rate" data-id="${b.id}" ${fl ? `data-tip="Date à vérifier dans l’Excel d’origine (${esc(fl.split(':')[1] || 'absente')})"` : `title="Noter ce titre"`}><span>${y === 0 ? (b.statut === 'abandonne' ? 'abdn.' : '') : d}</span><span>${esc(b.titre)}${b.support ? ` <span class="faint">· ${esc(b.support)}</span>` : ''}${b.avis ? ` <span class="faint" title="${esc(b.avis)}">✎</span>` : ''}</span>${noteBadge(noteOf(b), 'sm')}</li>`; }).join('') || '<li><span></span><span class="faint">—</span></li>'}</ul></div>`;
  };
  return `<div class="cols3">${CAT_LIST.map(col).join('')}</div>`;
}
function tlHTML() {
  const I = idx(), q = S.histo.q, years = [...I.years].sort((a, b) => b - a);
  const totals = y => sum(CAT_LIST.map(c => doneYear(y, c))), maxTot = Math.max(...years.map(totals));
  const filt = q || S.histo.f !== 'tous', hit = y => S.data.bibliotheque.some(b => b.annee === y && b.statut === 'termine' && histOk(b, q));
  const shown = years.filter(y => !filt || hit(y)), first = shown[0];
  const rows = shown.map(y => {
    const open = q || (S.histo.f !== 'tous' ? y === first : y === YEAR);
    return `<details class="ty" data-y="${y}" ${open ? 'open' : ''}><summary><span class="yr num">${y}</span>
      <div class="tri">${CAT_LIST.map(c => { const n = doneYear(y, c), o = goalOf(y, c); return `<div class="k-${c}"><b class="num" style="color:var(--acc)">${n}</b><span>${CATS[c].court}${o ? ` · obj. ${o}` : ''}</span>${o ? `<div class="bar"><i style="--w:${Math.min(100, n / o * 100)}%;--col:var(--acc)"></i></div>` : ''}</div>`; }).join('')}</div>
      <span class="faint num">${fmtInt(totals(y))} titres${totals(y) === maxTot ? ' · record' : ''}${y === YEAR ? ' · en cours' : ''}</span></summary>
      <div class="body" data-body>${open ? yearBody(y, q) : ''}</div></details>`;
  });
  const un = I.undated;
  if (!filt || S.data.bibliotheque.some(b => !b.annee && histOk(b, q)))
    rows.push(`<details class="ty" data-y="0" ${q || (filt && !shown.length) ? 'open' : ''}><summary><span class="yr num" style="font-size:1.4rem">Avant</span><div class="tri">${CAT_LIST.map(c => `<div class="k-${c}"><b class="num" style="color:var(--acc)">${un[c]}</b><span>${CATS[c].court} terminés</span></div>`).join('')}</div><span class="faint">Archive sans date · ${fmtInt(S.data.bibliotheque.filter(b => !b.annee).length)} lignes</span></summary><div class="body" data-body>${q ? yearBody(0, q) : ''}</div></details>`);
  return rows.join('') || empty('search', 'Aucun titre trouvé dans l’historique.');
}

/** Réduit une image en PNG léger (transparence conservée) pour la stocker dans data.json. */
async function shrinkImage(file, maxH = 260, cutBg = false) {
  const bmp = await createImageBitmap(file), k = Math.min(1, maxH / bmp.height);
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(bmp, 0, 0, c.width, c.height); bmp.close?.();
  if (cutBg) removeFlatBackground(g, c.width, c.height);
  return c.toDataURL('image/png');
}
/** Rend transparent un fond uni (même couleur aux quatre coins), en partant des bords : l'avatar se pose proprement sur le thème. */
function removeFlatBackground(g, w, h) {
  const im = g.getImageData(0, 0, w, h), d = im.data, at = (x, y) => (y * w + x) * 4;
  const corners = [[0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1]].map(([x, y]) => [d[at(x, y)], d[at(x, y) + 1], d[at(x, y) + 2], d[at(x, y) + 3]]);
  if (corners.some(p => p[3] < 250)) return;                                   // déjà transparent
  const ref = corners[0], dist = (i) => Math.max(Math.abs(d[i] - ref[0]), Math.abs(d[i + 1] - ref[1]), Math.abs(d[i + 2] - ref[2]));
  if (corners.some(p => Math.max(Math.abs(p[0] - ref[0]), Math.abs(p[1] - ref[1]), Math.abs(p[2] - ref[2])) > 28)) return;   // fond non uni
  const seen = new Uint8Array(w * h), stack = [];
  const push = (x, y) => { if (x < 0 || y < 0 || x >= w || y >= h) return; const p = y * w + x; if (seen[p] || dist(p * 4) > 34) return; seen[p] = 1; stack.push(p); };
  for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); } for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }
  while (stack.length) { const p = stack.pop(), x = p % w, y = (p / w) | 0; push(x + 1, y); push(x - 1, y); push(x, y + 1); push(x, y - 1); }
  for (let p = 0; p < w * h; p++) if (seen[p]) d[p * 4 + 3] = 0;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) { const p = y * w + x; if (seen[p]) continue;   // bord adouci : pixels clairs collés au fond
    if ((seen[p - 1] || seen[p + 1] || seen[p - w] || seen[p + w]) && dist(p * 4) < 90) d[p * 4 + 3] = 90; }
  g.putImageData(im, 0, 0);
}
