/* ───────────── Notes sur 100 et avis (titres de l'historique) ───────────── */
const noteOf = b => (b && b.note != null && b.note !== '' && !isNaN(+b.note)) ? +b.note : null;
const noteCol = n => n >= 85 ? 'var(--ok)' : n >= 70 ? 'var(--c-jeux)' : n >= 50 ? 'var(--warn)' : 'var(--bad)';
const noteBadge = (n, cls = '') => n == null ? '' : `<span class="nb ${cls}" style="--nc:${noteCol(n)}" title="Note : ${n} / 100">${n}</span>`;
const libById = id => S.data.bibliotheque.find(b => b.id === id);
/** Titres notés, du meilleur au moins bon. year = null pour tout l'historique ; cats = liste de catégories. */
function rankedNotes(year = null, cats = CAT_LIST) {
  const l = S.data.bibliotheque.filter(b => noteOf(b) != null && (year == null || b.annee === year) && cats.includes(b.categorie));
  l.sort((a, b) => noteOf(b) - noteOf(a) || (b.termineLe || '').localeCompare(a.termineLe || '') || a.titre.localeCompare(b.titre, 'fr'));
  let rang = 0, prev = null;                                   // ex æquo : même rang (1, 2, 2, 4…)
  return l.map((b, i) => { if (noteOf(b) !== prev) { rang = i + 1; prev = noteOf(b); } return { b, rang, note: noteOf(b) }; });
}
const toRate = () => S.data.bibliotheque.filter(b => b.statut === 'termine' && noteOf(b) == null);
const yearsWithNotes = () => [...new Set(S.data.bibliotheque.filter(b => noteOf(b) != null && b.annee).map(b => b.annee))].sort((a, b) => b - a);

/** Champs « note » + « avis » réutilisés dans la fin d'un titre et dans la fiche de notation. */
function noteFields(note, avis) {
  const has = note != null;
  return `<div class="field"><label for="f-note">Note sur 100 <span class="faint">(facultatif)</span></label>
    <div class="notein ${has ? '' : 'unset'}"><input type="range" min="0" max="100" step="1" value="${has ? note : 70}" data-in="note-r" aria-label="Note (curseur)" tabindex="-1">
      <input class="input num" id="f-note" name="note" type="number" min="0" max="100" step="1" inputmode="numeric" value="${has ? note : ''}" placeholder="—" data-in="note-n"></div></div>
    <div class="field"><label for="f-avis">Avis <span class="faint">(facultatif)</span></label><textarea class="input" id="f-avis" name="avis" rows="3" maxlength="2000" placeholder="Ce que tu en as pensé, en quelques mots…">${esc(avis || '')}</textarea></div>`;
}
/** Lit note/avis d'un formulaire et les range dans l'entrée e (supprime si vide). */

/* ───────────── Sauvegarde locale & restauration sécurisée ───────────── */

/* ───────────── Export Excel (.xlsx natif, sans bibliothèque) ───────────── */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

/* ───────────── HowLongToBeat : recherche + collage intelligent ─────────────
   HowLongToBeat n'a pas d'accès public : on ouvre sa recherche dans un onglet,
   tu copies le bloc des durées, et l'appli reconnaît Main / Main + / 100 %. */
const hltbUrl = t => 'https://howlongtobeat.com/?q=' + encodeURIComponent((t || '').trim());
/** « 25½ Hours », « 25.5 Hours », « 45 Mins », « 25h 30m », « 1h », « 40 min » → heures (arrondi à la demi-heure). */
function hltbDur(s) {
  s = s.replace(/½/g, '.5').replace(/,/g, '.');
  let m = s.match(/^\s*(\d+(?:\.\d+)?)\s*h(?:ours?|rs?)?\.?\s*(?:(\d+)\s*m(?:in(?:ute)?s?)?)?/i);
  if (m) return Math.round((+m[1] + (m[2] ? +m[2] / 60 : 0)) * 2) / 2;
  m = s.match(/^\s*(\d+(?:\.\d+)?)\s*(?:m|mins?|minutes?)\b/i);
  if (m) return Math.max(0.5, Math.round(+m[1] / 60 * 2) / 2);
  return null;
}
/** Reconnaît les durées dans un texte copié depuis HowLongToBeat (fiche du jeu ou résultat de recherche). */
function parseHltb(text) {
  const t = String(text || '').replace(/ /g, ' ').replace(/[ \t]+/g, ' ');
  const labels = [['main', /main\s*story/i], ['mainPlus', /main\s*\+\s*(?:sides?|extras?)/i], ['complet', /completionist/i]];
  const out = { main: null, mainPlus: null, complet: null };
  const DUR = /(\d+(?:[.,]\d+)?½?\s*(?:hours?|hrs?|h|mins?|minutes?|m)\b(?:\s*\d+\s*m(?:ins?)?\b)?)/i;
  for (const [k, re] of labels) {
    const m = re.exec(t); if (!m) continue;
    const after = t.slice(m.index + m[0].length, m.index + m[0].length + 80).split(/main\s*story|main\s*\+|completionist|all\s*(?:play)?styles|co-?op|vs\.?|single-player/i)[0];
    const d = after.match(DUR); if (d) out[k] = hltbDur(d[1]);
  }
  return out.main == null && out.mainPlus == null && out.complet == null ? null : out;
}
/** Bloc à insérer dans un formulaire de jeu : lien de recherche + champ « coller ». */
function hltbBlock(titre) {
  return `<div class="hltbbox"><div class="row" style="gap:8px;flex-wrap:wrap"><a class="btn sm" id="hltb-link" href="${hltbUrl(titre)}" target="_blank" rel="noopener">${ic('search')}Chercher sur HowLongToBeat</a>
      ${navigator.clipboard?.readText ? `<button type="button" class="btn sm" data-act="hltb-clip">${ic('download')}Coller les durées</button>` : ''}</div>
    <textarea class="input" data-in="hltb-paste" rows="2" placeholder="…ou colle ici le bloc copié sur HowLongToBeat (Main Story, Main + Sides, Completionist)" aria-label="Coller les durées HowLongToBeat"></textarea>
    <p class="hint faint" id="hltb-msg">Sur la fiche du jeu, sélectionne le bloc des durées, copie-le, puis reviens ici.</p></div>`;
}
function hltbApply(text) {
  const r = parseHltb(text), msg = $('#hltb-msg'), f = $('#modal-root form'); if (!f) return;
  if (!r) { if (msg) msg.innerHTML = text.trim() ? '<span style="color:var(--warn)">Aucune durée reconnue : copie le bloc « Main Story… Completionist ».</span>' : 'Sur la fiche du jeu, sélectionne le bloc des durées, copie-le, puis reviens ici.'; return; }
  for (const k of ['main', 'mainPlus', 'complet']) { const i = f.querySelector(`[name=${k}]`); if (i && r[k] != null) { i.value = r[k]; i.classList.add('flash'); setTimeout(() => i.classList.remove('flash'), 900); } }
  if (msg) msg.innerHTML = `<span style="color:var(--ok);display:inline-flex;gap:6px;align-items:center">${ic('check')}Rempli : ${[['Main', r.main], ['Main +', r.mainPlus], ['100 %', r.complet]].map(([l, v]) => `${l} ${v != null ? fmtH(v) : '—'}`).join(' · ')}</span>`;
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset?.in === 'hltb-paste') hltbApply(t.value);
  if (t.name === 'titre' && t.form && $('#hltb-link', t.form)) $('#hltb-link', t.form).href = hltbUrl(t.value);
});

  try { const txt = await navigator.clipboard.readText(); const ta = $('#modal-root [data-in=hltb-paste]'); if (ta) ta.value = txt; hltbApply(txt); }

  else if (k === 'sq') { S.series.q = t.value; $('#series-list').innerHTML = new DOMParser().parseFromString(VIEWS.series(), 'text/html').querySelector('#series-list').innerHTML; }
  else if (k === 'hq') { S.histo.q = t.value; $('#tl').innerHTML = tlHTML(); }
  else if (k === 'cmd') { CMD.q = t.value; CMD.sel = 0; cmdPaint(); }
  else if (k === 'weight') { const w = { ...S.data.config.poidsScore, [t.dataset.k]: +t.value }, tot = sum(Object.values(w)) || 1; for (const key in w) { const o = $('#wv-' + key); if (o) o.textContent = Math.round(w[key] / tot * 100) + ' %'; } }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.ch; if (!k) return;
  if (k === 'sort') { S.f[t.dataset.cat].sort = t.value; render(); }
  else if (k === 'stats-year') { S.stats.year = +t.value; render(); }
  else if (k === 'goal-year') goalsModal(+t.value);
  else if (k === 'weight') { snap(); S.data.config.poidsScore[t.dataset.k] = +t.value; commit(); }
  else if (k === 'pseudo') { snap(); S.data.profil.pseudo = t.value.trim(); commit(); }
  else if (k === 'avatar') { const f = t.files?.[0]; if (f) shrinkImage(f, 260, true).then(img => { snap(); S.data.profil.avatar = img; commit(); settingsModal(); }).catch(() => toast('Cette image n’a pas pu être lue (essaie un PNG ou un JPEG).')); }
  else if (k === 'ref') { snap(); S.data.config.referenceHltb = t.value; commit(); }
});
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.matches?.('details.ty') || !d.open) return;
  const b = d.querySelector('[data-body]'); if (b && !b.innerHTML.trim()) b.innerHTML = yearBody(+d.dataset.y, S.histo.q);
}, true);
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'k' && S.data) { e.preventDefault(); cmdOpen(); }
  else if (mod && e.key.toLowerCase() === 's' && S.data) { e.preventDefault(); save(); }
  else if (e.key === 'Escape') closeModal();
  else if (e.target.id === 'cmd-in') {
    if (e.key === 'ArrowDown') { e.preventDefault(); CMD.sel++; cmdPaint(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); CMD.sel--; cmdPaint(); }
    else if (e.key === 'Enter') { e.preventDefault(); cmdRun(CMD.sel); }
  } else if (e.key === 'Enter' && e.target.matches?.('[role=button][data-act]')) e.target.click();
});

/* — Infobulles — */
const tipEl = $('#tip');
const placeTip = e => { const w = tipEl.offsetWidth, h = tipEl.offsetHeight; let x = e.clientX + 14, y = e.clientY + 16; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14; tipEl.style.left = Math.max(8, x) + 'px'; tipEl.style.top = Math.max(8, y) + 'px'; };
document.addEventListener('mouseover', e => { const el = e.target.closest?.('[data-tip]'); if (!el) return; tipEl.textContent = el.dataset.tip; tipEl.classList.add('on'); placeTip(e); });
document.addEventListener('mousemove', e => { if (tipEl.classList.contains('on')) placeTip(e); });
document.addEventListener('mouseout', e => { if (e.target.closest?.('[data-tip]')) tipEl.classList.remove('on'); });
document.addEventListener('scroll', () => tipEl.classList.remove('on'), { passive: true });

/* — Connexion GitHub (réglages et écran d'accueil) — */
FORMS.sync = async (fd, f) => {
  const msg = $('#sy-msg', f), btn = f.querySelector('button[type=submit]'); const say = t => { if (msg) msg.textContent = t; };
  const cfg = { repo: String(fd.get('repo')).trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$|\/$/g, ''), token: String(fd.get('token')).trim(), path: String(fd.get('path') || 'data.json').trim() || 'data.json', branch: String(fd.get('branch') || 'main').trim() || 'main', expire: String(fd.get('expire') || '') || null };
  btn.disabled = true; say('Vérification…');
  const err = await syncTest(cfg); if (err) { say(err); btn.disabled = false; return; }
  localStorage.setItem('cockpit.sync', JSON.stringify(cfg)); SY.sha = null; SY.state = 'wait';
  try {
    const r = await ghRead(); SY.sha = r.sha;
    if (!S.data) {                                                  // écran d'accueil : on charge ce que contient le dépôt
      if (r.text) { S.linked = true; setSync('ok'); start(parseData(r.text)); toast('Connecté : données chargées depuis GitHub'); }
      else { setSync('ok'); say('Connecté. Le dépôt est vide : ouvre ton data.json pour l’y envoyer.'); btn.disabled = false; }
      return;
    }
    closeModal();
    if (!r.text) { S.dirty = true; await pushNow(true); }           // dépôt vide : on y envoie les données actuelles
    else if (r.text.trim() === (ser(S.data) + '\n').trim()) { S.linked = true; setSync('ok'); toast('Connecté : déjà à jour'); }
    else { setSync('conflict'); conflictBanner('Le dépôt contient déjà des données différentes de celles de cet écran.'); }
    settingsModal();
  } catch (e) { say(e.message); btn.disabled = false; }
};

/* — Thème — */
function applyTheme() {
  const t = localStorage.getItem('cockpit.theme') || 'dark';
  document.documentElement.dataset.theme = t;
  $('#btn-theme').innerHTML = ic(t === 'dark' ? 'sun' : 'moon');
}
function toggleTheme() { localStorage.setItem('cockpit.theme', document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); applyTheme(); render(); }
$('#btn-theme').onclick = toggleTheme;
$('#btn-cmd').onclick = cmdOpen;
$('#btn-settings').onclick = settingsModal;
$('#app').insertAdjacentHTML('beforeend', `<button class="fab" id="fab" data-act="quick" title="Ajout rapide" aria-label="Ajout rapide">${ic('plus')}</button>`);
$('#savepill').onclick = save;
$('#file-input').onchange = e => { const f = e.target.files[0]; if (f) openPicked(f, null); e.target.value = ''; };

/* — Démarrage — */
function showWelcome() {
  const boot = $('#boot');
  boot.innerHTML = `<div class="glass box"><svg class="mark" style="margin:auto;width:56px;height:56px" aria-hidden="true"><use href="#logo"/></svg><h1>Backlog</h1>
    <p>Pour afficher tes données, choisis le fichier <code>data.json</code>. Le navigateur s’en souvient : tu ne le fais qu’une fois.</p>
    <div class="row" style="justify-content:center;margin:20px 0 14px"><button class="btn primary" id="w-pick">${ic('folder')}Ouvrir data.json</button>${S.handle ? `<button class="btn" id="w-resume">${ic('history')}Reprendre avec ${esc(S.handle.name)}</button>` : ''}</div>
    ${S.loadError ? `<div class="warnbox bad" style="text-align:left">${ic('ban')}<span>Les données n’ont pas pu être chargées. ${esc(S.loadError)}</span></div>
      ${syncOn() ? `<div class="row" style="justify-content:center;margin-bottom:14px"><button class="btn" data-act="versions">${ic('history')}Revenir à une version précédente</button></div>` : ''}` : ''}
    <details style="text-align:left;margin-bottom:14px" ${syncOn() ? 'open' : ''}><summary class="muted" style="cursor:pointer;text-align:center;font-size:.9rem">Synchroniser avec GitHub (téléphone et ordinateur)</summary><div style="margin-top:12px">${syncFormHTML(syncCfg() || {})}</div></details>
    <p class="faint" style="font-size:.84rem">Ouverte par double-clic, la page ne peut pas lire <code>data.json</code> toute seule : c’est une règle des navigateurs, pas un bug. Autre option : lance <code>python3 -m http.server</code> dans ce dossier, puis ouvre <code>localhost:8000</code>.</p></div>`;
  $('#w-pick').onclick = pickFile; $('#w-resume')?.addEventListener('click', resumeLinked);
}
function start(d) {
  S.data = d; S._idx = null; S.dirty = false; resetUndo();
  $('#boot').hidden = true; $('#boot').innerHTML = ''; $('#app').hidden = false;
  const h = location.hash.slice(1); if (VIEWS[h]) S.view = h;
  $('#banner').innerHTML = '';
  try {
    const dr = JSON.parse(localStorage.getItem('cockpit.draft') || 'null');
    if (dr && dr.meta && dr.meta.rev > d.meta.rev) {
      $('#banner').innerHTML = `<div class="banner">${ic('save')}<span>Des modifications non enregistrées ont été retrouvées (${fmtDate(dr.meta.majLe)}).</span><span class="spacer"></span><button class="btn sm" id="dr-ok">Restaurer</button><button class="btn sm ghost" id="dr-no">Ignorer</button></div>`;
      $('#dr-ok').onclick = () => { S.data = parseData(JSON.stringify(dr)); S._idx = null; S.dirty = true; $('#banner').innerHTML = ''; paintSave(); autosave(); render(); };
      $('#dr-no').onclick = () => { localStorage.removeItem('cockpit.draft'); $('#banner').innerHTML = ''; };
    }
  } catch { /* brouillon illisible : ignoré */ }
  paintSave(); render(); paintNotices();
}
(async function boot() {
  applyTheme();
  try { const d = await loadData(); d ? start(d) : showWelcome(); }
  catch (e) { console.error(e); showWelcome(); toast('Erreur de chargement : ' + e.message); }
})();
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (S.data && VIEWS[h] && h !== S.view) { S.view = h; render(); } });
</script>
</body>
